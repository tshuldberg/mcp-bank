# ARCHIVED. The live extractor is mcp-apps/mcp-structured-extractor (Fly app
# mcp-bank-extractor). This name is deliberately different so a deploy from here
# can never replace it. Do not create this Fly app.
app = "mcp-bank-extractor-archived"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"
  BASE_URL = "https://mcp-bank-extractor-archived.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  grace_period = "5s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"
